[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jegpant"
version = "0.1.0"
description = "Evidence-grounded cognitive system foundations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - no license granted yet" }
authors = [{ name = "JEGPANT maintainers" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
