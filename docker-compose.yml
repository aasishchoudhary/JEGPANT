services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jegpant:local
    restart: unless-stopped
    environment:
      JEGPANT_INSTANCE_ID: ${JEGPANT_INSTANCE_ID:?Set JEGPANT_INSTANCE_ID in .env}
      JEGPANT_OWNER_PUBLIC_KEY_B64: ${JEGPANT_OWNER_PUBLIC_KEY_B64:?Set the Android owner public key in .env}
      JEGPANT_OWNER_KEY_ALGORITHM: ecdsa_p256
      JEGPANT_OWNER_KEY_ID: owner-key-v1
      JEGPANT_STORAGE_ROOT: /data
      JEGPANT_LOCAL_MASTER_KEY_PATH: /data/keys/master.key
      JEGPANT_ALLOW_LOCAL_FILE_KEYS: "true"
      JEGPANT_INITIALIZE_LOCAL_STORAGE: ${JEGPANT_INITIALIZE_LOCAL_STORAGE:-true}
      JEGPANT_MAX_MEDIA_BYTES: ${JEGPANT_MAX_MEDIA_BYTES:-8589934592}
      JEGPANT_MAX_JSON_BYTES: ${JEGPANT_MAX_JSON_BYTES:-1048576}
    volumes:
      - jegpant_data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: jegpant:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - worker
    command:
      - python
      - -m
      - jegpant.worker_runner
      - --poll-seconds
      - "2"
      - --lease-seconds
      - "900"
    environment:
      JEGPANT_INSTANCE_ID: ${JEGPANT_INSTANCE_ID:?Set JEGPANT_INSTANCE_ID in .env}
      JEGPANT_OWNER_PUBLIC_KEY_B64: ${JEGPANT_OWNER_PUBLIC_KEY_B64:?Set the Android owner public key in .env}
      JEGPANT_OWNER_KEY_ALGORITHM: ecdsa_p256
      JEGPANT_OWNER_KEY_ID: owner-key-v1
      JEGPANT_STORAGE_ROOT: /data
      JEGPANT_LOCAL_MASTER_KEY_PATH: /data/keys/master.key
      JEGPANT_ALLOW_LOCAL_FILE_KEYS: "true"
      JEGPANT_INITIALIZE_LOCAL_STORAGE: "false"
      JEGPANT_LLM_BASE_URL: ${JEGPANT_LLM_BASE_URL:-http://127.0.0.1:3001/v1}
      JEGPANT_LLM_MODEL: ${JEGPANT_LLM_MODEL:-local-model}
      JEGPANT_LLM_API_KEY: ${JEGPANT_LLM_API_KEY:-}
      JEGPANT_LLM_TIMEOUT_SECONDS: ${JEGPANT_LLM_TIMEOUT_SECONDS:-120}
      JEGPANT_ALLOW_REMOTE_INFERENCE: ${JEGPANT_ALLOW_REMOTE_INFERENCE:-false}
    volumes:
      - jegpant_data:/data
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g
    cpus: 4.0

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      JEGPANT_DOMAIN: ${JEGPANT_DOMAIN:?Set a DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

networks:
  edge:
  backend:

volumes:
  jegpant_data:
  caddy_data:
  caddy_config:
